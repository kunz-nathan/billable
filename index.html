<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Billable Meter</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#11161B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Billable">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --ground: #11161B;
    --surface: #19212A;
    --surface-2: #202B36;
    --rule: #2B3945;
    --ink: #E7EDF2;
    --ink-2: #9BAAB8;
    --ink-3: #6B7C8B;
    --brass: #D8A63C;
    --blueback: #4E86BE;
    --danger: #C4634F;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  :root[data-theme="light"] {
    --ground: #E4E7E3;
    --surface: #F5F6F3;
    --surface-2: #ECEEE9;
    --rule: #CBD0CA;
    --ink: #171C21;
    --ink-2: #4E5A64;
    --ink-3: #7C8892;
    --brass: #8A6512;
    --blueback: #2C5D8F;
    --danger: #9A3B28;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px 64px; }

  /* ---------- masthead ---------- */
  header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 22px 0 14px; border-bottom: 1px solid var(--rule);
  }
  .mark {
    font-family: var(--serif); font-size: 19px; letter-spacing: .01em;
  }
  .mark em { font-style: normal; color: var(--brass); }
  .today { font-family: var(--mono); font-size: 12px; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; }
  .spacer { flex: 1; }
  .iconbtn {
    background: none; border: 1px solid var(--rule); color: var(--ink-2);
    width: 30px; height: 30px; border-radius: 3px; cursor: pointer; font-size: 14px;
    display: grid; place-items: center; padding: 0;
  }
  .iconbtn:hover { color: var(--ink); border-color: var(--ink-3); }

  /* ---------- the meter (signature) ---------- */
  .meter {
    margin: 20px 0 8px; padding: 20px;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 4px;
    position: relative; overflow: hidden;
  }
  .meter.idle { background: transparent; border-style: dashed; text-align: center; padding: 26px 20px; }
  .meter.idle p { margin: 0; color: var(--ink-3); font-family: var(--serif); font-size: 17px; }
  .meter-matter {
    font-family: var(--serif); font-size: 20px; margin: 0 0 2px;
    display: flex; align-items: baseline; gap: 8px;
  }
  .meter-client { font-family: var(--sans); font-size: 12px; color: var(--ink-3); }
  .readout { display: flex; align-items: baseline; gap: 14px; margin: 10px 0 4px; }
  .decimal {
    font-family: var(--mono); font-size: 58px; line-height: .95; font-weight: 500;
    letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--brass);
  }
  .decimal .unit { font-size: 15px; letter-spacing: .08em; color: var(--ink-3); margin-left: 8px; text-transform: uppercase; }
  .elapsed {
    font-family: var(--mono); font-size: 15px; color: var(--ink-2);
    font-variant-numeric: tabular-nums; margin-left: auto;
  }
  /* tenths bar: ten segments, one per 6 minutes */
  .tenths { display: flex; gap: 3px; margin: 14px 0 6px; }
  .tenths i {
    flex: 1; height: 8px; background: var(--surface-2);
    border: 1px solid var(--rule); border-radius: 1px; position: relative; overflow: hidden;
  }
  .tenths i b { position: absolute; inset: 0; width: 0; background: var(--brass); display: block; }
  .tenths i.full b { width: 100%; }
  .tenths-label {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-3); display: flex; justify-content: space-between;
  }
  .meter-actions { display: flex; gap: 8px; align-items: center; margin-top: 16px; }
  .live-note {
    width: 100%; margin-top: 16px; background: var(--ground);
    border: 1px solid var(--rule); border-radius: 3px; color: var(--ink);
    font-family: var(--sans); font-size: 13.5px; line-height: 1.45;
    padding: 9px 11px; resize: none; overflow: hidden; min-height: 44px;
  }
  .live-note::placeholder { color: var(--ink-3); opacity: .7; font-style: italic; }
  .live-note:focus { outline: none; border-color: var(--blueback); }
  .longrun { font-size: 12.5px; color: var(--danger); margin-left: auto; }

  /* ---------- buttons ---------- */
  button { font-family: inherit; font-size: 14px; }
  .btn {
    background: var(--surface-2); color: var(--ink); border: 1px solid var(--rule);
    padding: 8px 16px; border-radius: 3px; cursor: pointer;
  }
  .btn:hover { border-color: var(--ink-3); }
  .btn-stop { background: var(--brass); border-color: var(--brass); color: #16110A; font-weight: 600; }
  .btn-stop:hover { filter: brightness(1.08); }
  .btn-ghost { background: none; border: none; color: var(--ink-3); padding: 6px 0; cursor: pointer; }
  .btn-ghost:hover { color: var(--brass); }
  :focus-visible { outline: 2px solid var(--blueback); outline-offset: 2px; }

  /* ---------- matter rows ---------- */
  .section-head {
    display: flex; align-items: baseline; margin: 30px 0 6px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink-3);
    border-bottom: 1px solid var(--rule); padding-bottom: 6px;
  }
  .section-head .spacer { flex: 1; }
  .matter {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 0; border-bottom: 1px solid var(--rule);
  }
  .matter-name { font-family: var(--serif); font-size: 17px; }
  .matter-sub { font-size: 12px; color: var(--ink-3); }
  .matter-today {
    font-family: var(--mono); font-size: 15px; color: var(--ink-2);
    font-variant-numeric: tabular-nums; margin-left: auto;
  }
  .matter-today.zero { color: var(--ink-3); opacity: .45; }
  .play {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--rule);
    background: none; color: var(--ink-2); cursor: pointer; display: grid; place-items: center;
    font-size: 12px; flex: none; padding: 0;
  }
  .play:hover { border-color: var(--brass); color: var(--brass); }
  .play.on { background: var(--brass); border-color: var(--brass); color: #16110A; }
  .rowmenu { position: relative; }

  /* ---------- ledger ---------- */
  .daynav { display: flex; align-items: center; gap: 6px; }
  .daynav b { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: var(--ink-2); font-weight: 500; }
  .entry {
    display: grid; grid-template-columns: 96px 1fr 54px 34px 30px;
    gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--rule);
  }
  .entry-time { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); padding-top: 2px; font-variant-numeric: tabular-nums; }
  .entry-matter { font-family: var(--serif); font-size: 15.5px; }
  .entry-note {
    width: 100%; background: none; border: none; color: var(--ink-2); font-family: var(--sans);
    font-size: 13px; padding: 2px 0; resize: none; overflow: hidden; line-height: 1.4;
  }
  .entry-note::placeholder { color: var(--ink-3); opacity: .55; font-style: italic; }
  .entry-note:focus { outline: none; border-bottom: 1px solid var(--blueback); color: var(--ink); }
  .entry-hours {
    font-family: var(--mono); font-size: 15px; text-align: right; font-variant-numeric: tabular-nums;
    background: none; border: none; color: var(--ink); width: 100%; padding: 2px 0;
  }
  .entry-hours:focus { outline: none; border-bottom: 1px solid var(--blueback); }
  .entry-resume {
    background: none; border: 1px solid var(--rule); border-radius: 50%;
    width: 26px; height: 26px; color: var(--ink-3); cursor: pointer;
    display: grid; place-items: center; font-size: 10px; padding: 0; margin-left: 8px;
  }
  .entry-resume:hover { border-color: var(--brass); color: var(--brass); }
  .entry-del { background: none; border: none; color: var(--ink-3); cursor: pointer; opacity: 0; font-size: 15px; padding: 0; margin-left: 6px; }
  .entry:hover .entry-del, .entry-del:focus { opacity: 1; }
  .entry-del:hover { color: var(--danger); }
  .daytotal {
    display: flex; align-items: baseline; gap: 10px; padding: 14px 0 0;
    font-family: var(--mono); font-variant-numeric: tabular-nums;
  }
  .daytotal .n { font-size: 26px; color: var(--brass); }
  .daytotal .lbl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .daytotal .amt { margin-left: auto; font-size: 14px; color: var(--ink-2); }
  .empty { color: var(--ink-3); font-family: var(--serif); font-size: 16px; padding: 18px 0; }

  /* ---------- forms / dialogs ---------- */
  dialog {
    background: var(--surface); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 4px; padding: 22px; width: min(440px, 92vw);
  }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h3 { font-family: var(--serif); font-weight: 500; font-size: 19px; margin: 0 0 16px; }
  label { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 12px 0 4px; font-family: var(--mono); }
  input[type=text], input[type=number], input[type=date], select, textarea.f {
    width: 100%; background: var(--ground); border: 1px solid var(--rule); color: var(--ink);
    padding: 8px 10px; border-radius: 3px; font-family: var(--sans); font-size: 14px;
  }
  .hint { font-size: 12px; color: var(--ink-3); margin-top: 5px; }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 22px; flex-wrap: wrap; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .csvbox { width: 100%; height: 220px; font-family: var(--mono); font-size: 11px; }
  .quickpick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .quickpick .btn { padding: 5px 11px; font-size: 12px; }
  .daypick {
    max-height: 190px; overflow-y: auto; border: 1px solid var(--rule);
    border-radius: 3px; background: var(--ground); padding: 4px 0;
  }
  .daypick label {
    display: flex; align-items: center; gap: 10px; margin: 0;
    padding: 6px 12px; font-family: var(--sans); font-size: 13.5px;
    text-transform: none; letter-spacing: 0; color: var(--ink); cursor: pointer;
  }
  .daypick label:hover { background: var(--surface-2); }
  .daypick .d-hrs {
    margin-left: auto; font-family: var(--mono); font-size: 12.5px;
    color: var(--ink-2); font-variant-numeric: tabular-nums;
  }
  .daypick .d-n { font-size: 11.5px; color: var(--ink-3); }
  .daypick input { accent-color: var(--brass); }
  .settings-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--rule); }
  .settings-row span { flex: 1; font-size: 14px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--rule); color: var(--ink);
    padding: 9px 16px; border-radius: 3px; font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  .nudge {
    display: flex; align-items: center; gap: 12px; margin-top: 14px;
    padding: 10px 14px; border: 1px solid var(--rule); border-left: 3px solid var(--blueback);
    border-radius: 3px; font-size: 13px; color: var(--ink-2); background: var(--surface);
  }
  .nudge span { flex: 1; }

  /* ---------- phone ---------- */
  body { padding-top: env(safe-area-inset-top); }
  @media (max-width: 700px) {
    .wrap { padding: 0 14px calc(40px + env(safe-area-inset-bottom)); }
    header { padding: 14px 0 12px; }
    .mark { font-size: 17px; }
    .today { font-size: 11px; }
    .iconbtn { width: 38px; height: 38px; }
    .meter { padding: 16px; }
    .decimal { font-size: 52px; }
    .elapsed { font-size: 14px; }
    .tenths i { height: 10px; }
    .btn-stop { padding: 14px 30px; font-size: 16px; }
    .live-note { font-size: 16px; min-height: 60px; }
    .matter { padding: 14px 0; gap: 14px; }
    .play { width: 46px; height: 46px; font-size: 15px; }
    .matter-name { font-size: 16px; }
    .btn-ghost { padding: 12px 0; }
    .entry { grid-template-columns: 62px 1fr 46px; gap: 8px; }
    .entry-resume, .entry-del {
      grid-column: 3; justify-self: end; margin: 6px 0 0;
    }
    .entry-del { opacity: 1; font-size: 20px; }
    .entry-resume { width: 34px; height: 34px; }
    .entry-time { font-size: 11.5px; }
    .entry-note, .entry-hours { font-size: 16px; }
    dialog { padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); width: 94vw; }
    input[type=text], input[type=number], input[type=date], select, textarea.f { font-size: 16px; padding: 12px 10px; }
    .btn { padding: 12px 16px; }
    .dlg-actions { justify-content: stretch; }
    .dlg-actions .btn { flex: 1 1 44%; }
    .daypick label { padding: 12px; font-size: 15px; }
    .daypick input { width: 20px; height: 20px; }
    .csvbox { height: 130px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 520px) {
    .decimal { font-size: 46px; }
    .entry { grid-template-columns: 72px 1fr 50px 22px; gap: 8px; }
    .entry-matter { font-size: 14.5px; }
  }
</style>

<div class="wrap">
  <header>
    <div class="mark">Billable <em>Meter</em></div>
    <div class="today" id="masthead-date"></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="theme-btn" title="Switch light / dark">◐</button>
    <button class="iconbtn" id="settings-btn" title="Settings">⚙</button>
  </header>

  <div id="meter"></div>

  <div id="nudge"></div>

  <div class="section-head">
    <span>Matters</span>
    <span class="spacer"></span>
    <span id="matters-head-right">today</span>
  </div>
  <div id="matters"></div>
  <button class="btn-ghost" id="add-matter-btn">+ Add matter</button>

  <div class="section-head">
    <span class="daynav">
      <button class="iconbtn" id="day-prev" title="Previous day" style="width:22px;height:22px;font-size:11px">‹</button>
      <b id="day-label"></b>
      <button class="iconbtn" id="day-next" title="Next day" style="width:22px;height:22px;font-size:11px">›</button>
    </span>
    <span class="spacer"></span>
    <button class="btn-ghost" id="manual-btn" style="font-size:11px;letter-spacing:.14em;text-transform:uppercase">+ add time</button>
    <span style="width:14px"></span>
    <button class="btn-ghost" id="export-btn" style="font-size:11px;letter-spacing:.14em;text-transform:uppercase">export</button>
  </div>
  <div id="ledger"></div>
</div>

<div class="toast" id="toast"></div>

<!-- matter dialog -->
<dialog id="matter-dlg">
  <h3 id="matter-dlg-title">Add matter</h3>
  <input type="hidden" id="m-id">
  <label for="m-name">Matter</label>
  <input type="text" id="m-name" placeholder="Smith v. Jones — appeal">
  <div class="two">
    <div>
      <label for="m-client">Client</label>
      <input type="text" id="m-client" placeholder="optional">
    </div>
    <div>
      <label for="m-rate">Hourly rate</label>
      <input type="number" id="m-rate" placeholder="optional" step="1" min="0">
    </div>
  </div>
  <div class="dlg-actions">
    <button class="btn" id="m-archive" style="margin-right:auto">Remove</button>
    <button class="btn" data-close>Cancel</button>
    <button class="btn btn-stop" id="m-save">Save</button>
  </div>
</dialog>

<!-- manual time dialog -->
<dialog id="manual-dlg">
  <h3>Add time</h3>
  <label for="x-matter">Matter</label>
  <select id="x-matter"></select>
  <div class="two">
    <div>
      <label for="x-date">Date</label>
      <input type="date" id="x-date">
    </div>
    <div>
      <label for="x-dur">Duration</label>
      <input type="text" id="x-dur" placeholder="1.4">
    </div>
  </div>
  <div class="hint">Accepts 1.4 · 1:24 · 84m · 1h24</div>
  <label for="x-note">Description</label>
  <input type="text" id="x-note" placeholder="Reviewed opposition; drafted reply outline">
  <div class="dlg-actions">
    <button class="btn" data-close>Cancel</button>
    <button class="btn btn-stop" id="x-save">Add time</button>
  </div>
</dialog>

<!-- settings dialog -->
<dialog id="settings-dlg">
  <h3>Settings</h3>
  <label for="s-round">Billing increment</label>
  <select id="s-round">
    <option value="up">Round up to the next tenth (0.1)</option>
    <option value="near">Round to the nearest tenth</option>
    <option value="quarter">Round up to the next quarter (0.25)</option>
    <option value="exact">Exact — no rounding</option>
  </select>
  <div class="hint">Applied to each entry, then summed. Raw elapsed time is always kept underneath.</div>
  <label for="s-min">Minimum per entry</label>
  <input type="text" id="s-min" placeholder="0.1">
  <div class="settings-row" style="margin-top:18px">
    <span>Show dollar amounts</span>
    <input type="checkbox" id="s-money">
  </div>
  <label style="margin-top:20px">Backup file</label>
  <div class="hint" id="backup-status" style="margin-top:0"></div>
  <div style="display:flex;gap:8px;margin-top:10px">
    <button class="btn" id="s-backup" style="flex:1">Save backup</button>
    <button class="btn" id="s-restore" style="flex:1">Restore from backup</button>
  </div>
  <input type="file" id="restore-input" accept=".json,application/json" style="display:none">
  <div class="dlg-actions">
    <button class="btn" id="s-wipe" style="margin-right:auto">Erase all data</button>
    <button class="btn btn-stop" data-close>Done</button>
  </div>
</dialog>

<!-- export dialog -->
<dialog id="export-dlg">
  <h3>Export time</h3>
  <label>Days</label>
  <div class="quickpick">
    <button class="btn" data-pick="today">Today</button>
    <button class="btn" data-pick="week">This week</button>
    <button class="btn" data-pick="month">This month</button>
    <button class="btn" data-pick="all">All</button>
    <button class="btn" data-pick="none">None</button>
  </div>
  <div id="e-days" class="daypick"></div>
  <label for="e-out">Preview</label>
  <textarea id="e-out" class="csvbox f" readonly></textarea>
  <div class="dlg-actions">
    <button class="btn" data-close>Close</button>
    <button class="btn" id="e-download">.csv file</button>
    <button class="btn" id="e-copy">Copy CSV</button>
    <button class="btn" id="e-tsv">Copy plain</button>
    <button class="btn btn-stop" id="e-rich">Copy styled</button>
  </div>
</dialog>

<script>
(function () {
  "use strict";

  /* ---------------- storage: works inside Claude and as a local file ------- */
  var KEY = "billable-meter-v1";
  var store = {
    get: async function () {
      try {
        if (window.storage) {
          var r = await window.storage.get(KEY);
          return r && r.value ? JSON.parse(r.value) : null;
        }
      } catch (e) { /* key absent or unavailable */ }
      try { var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }
      catch (e) { return null; }
    },
    set: async function (obj) {
      var s = JSON.stringify(obj);
      try { if (window.storage) { await window.storage.set(KEY, s); return; } } catch (e) {}
      try { localStorage.setItem(KEY, s); } catch (e) {}
    }
  };

  var state = {
    matters: [],
    entries: [],
    running: null,          // { matterId, startedAt }
    settings: { round: "up", min: 0.1, money: false, theme: "dark" }
  };
  var viewDate = todayKey();
  var saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { store.set(state); }, 250);
  }

  /* ---------------- time helpers ---------------------------------------- */
  function uid() { return Math.random().toString(36).slice(2, 10); }
  function todayKey(d) {
    d = d || new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function keyToDate(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function shiftDay(k, n) { var d = keyToDate(k); d.setDate(d.getDate() + n); return todayKey(d); }
  function clock(sec) {
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return h + ":" + pad(m) + ":" + pad(s);
  }
  function hhmm(iso) {
    var d = new Date(iso), h = d.getHours(), m = d.getMinutes();
    var ap = h >= 12 ? "p" : "a"; h = h % 12; if (h === 0) h = 12;
    return h + ":" + pad(m) + ap;
  }
  function billable(sec) {
    var h = sec / 3600, r = state.settings.round;
    var v;
    if (r === "exact") v = Math.round(h * 100) / 100;
    else if (r === "near") v = Math.round(h * 10) / 10;
    else if (r === "quarter") v = Math.ceil(h * 4 - 1e-9) / 4;
    else v = Math.ceil(h * 10 - 1e-9) / 10;
    var min = state.settings.min || 0;
    if (sec > 0 && v < min) v = min;
    return Math.round(v * 100) / 100;
  }
  function fmtH(v) { return v.toFixed(state.settings.round === "exact" ? 2 : (state.settings.round === "quarter" ? 2 : 1)); }
  function parseDur(str) {
    if (!str) return 0;
    str = String(str).trim().toLowerCase();
    var m;
    if ((m = str.match(/^(\d+)\s*h\s*(\d+)\s*m?$/))) return (+m[1]) * 3600 + (+m[2]) * 60;
    if ((m = str.match(/^(\d+):(\d{1,2})$/))) return (+m[1]) * 3600 + (+m[2]) * 60;
    if ((m = str.match(/^(\d+(?:\.\d+)?)\s*m(?:in)?$/))) return Math.round(+m[1] * 60);
    if ((m = str.match(/^(\d+(?:\.\d+)?)\s*h?$/))) return Math.round(+m[1] * 3600);
    return 0;
  }
  function matterById(id) {
    for (var i = 0; i < state.matters.length; i++) if (state.matters[i].id === id) return state.matters[i];
    return null;
  }
  function entriesOn(key) {
    return state.entries.filter(function (e) { return e.day === key; })
      .sort(function (a, b) { return (a.start || "").localeCompare(b.start || ""); });
  }
  function runningSeconds() {
    if (!state.running) return 0;
    return (Date.now() - new Date(state.running.startedAt).getTime()) / 1000;
  }

  /* ---------------- actions --------------------------------------------- */
  function start(matterId) {
    if (state.running) stop();
    state.running = { matterId: matterId, startedAt: new Date().toISOString(), note: "" };
    save(); render();
  }
  function entryById(id) {
    for (var i = 0; i < state.entries.length; i++) if (state.entries[i].id === id) return state.entries[i];
    return null;
  }
  function resumeBase() {
    if (!state.running || !state.running.resumeId) return 0;
    var e = entryById(state.running.resumeId);
    return e ? e.seconds : 0;
  }
  function resume(id) {
    var e = entryById(id);
    if (!e) return;
    if (e.day !== todayKey()) { toast("Only today's entries can be resumed."); return; }
    if (state.running) stop();
    state.running = {
      matterId: e.matterId, startedAt: new Date().toISOString(),
      note: e.note || "", resumeId: e.id
    };
    save(); render();
  }
  function stop() {
    if (!state.running) return;
    var sec = Math.round(runningSeconds());
    var startedAt = state.running.startedAt;
    var mid = state.running.matterId;
    var note = state.running.note || "";
    var resumeId = state.running.resumeId;
    state.running = null;
    if (sec >= 1) {
      var target = resumeId ? entryById(resumeId) : null;
      if (target) {
        target.seconds += sec;
        target.end = new Date().toISOString();
        target.note = note;
        target.sessions = (target.sessions || 1) + 1;
      } else {
        state.entries.push({
          id: uid(), matterId: mid, day: todayKey(new Date(startedAt)),
          start: startedAt, end: new Date().toISOString(), seconds: sec, note: note
        });
      }
    }
    save(); render();
  }

  /* ---------------- render ---------------------------------------------- */
  var $ = function (s) { return document.querySelector(s); };
  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }

  function render() {
    document.documentElement.setAttribute("data-theme", state.settings.theme === "light" ? "light" : "dark");
    $("#masthead-date").textContent = new Date().toLocaleDateString(undefined,
      { weekday: "short", month: "short", day: "numeric" });
    renderMeter();
    renderMatters();
    renderLedger();
    renderNudge();
  }

  function renderMeter() {
    var box = $("#meter");
    box.innerHTML = "";
    if (!state.running) {
      var idle = el("div", "meter idle");
      var p = el("p", null, state.matters.length ? "No timer running." : "Add a matter to start the clock.");
      idle.appendChild(p);
      box.appendChild(idle);
      return;
    }
    var m = matterById(state.running.matterId) || { name: "(deleted matter)" };
    var base = resumeBase();
    var sec = base + runningSeconds();
    var card = el("div", "meter");

    var h1 = el("div", "meter-matter");
    h1.appendChild(el("span", null, m.name));
    if (m.client) h1.appendChild(el("span", "meter-client", m.client));
    if (base > 0) h1.appendChild(el("span", "meter-client", "· continuing " + clock(base) + " logged earlier"));
    card.appendChild(h1);

    var read = el("div", "readout");
    var dec = el("div", "decimal");
    dec.id = "live-decimal";
    dec.appendChild(el("span", null, fmtH(billable(sec))));
    var u = el("span", "unit", "hrs");
    dec.appendChild(u);
    read.appendChild(dec);
    var ela = el("div", "elapsed", clock(sec));
    ela.id = "live-elapsed";
    read.appendChild(ela);
    card.appendChild(read);

    var bar = el("div", "tenths");
    for (var i = 0; i < 10; i++) {
      var seg = el("i"); seg.appendChild(el("b"));
      bar.appendChild(seg);
    }
    bar.id = "live-tenths";
    card.appendChild(bar);

    var lbl = el("div", "tenths-label");
    lbl.appendChild(el("span", null, "tenths of the current hour"));
    var hrs = el("span", null, "");
    hrs.id = "live-hourmark";
    lbl.appendChild(hrs);
    card.appendChild(lbl);

    var acts = el("div", "meter-actions");

    var live = document.createElement("textarea");
    live.className = "live-note";
    live.rows = 2;
    live.placeholder = "What you're doing — saved with this entry when you stop";
    live.value = state.running.note || "";
    live.oninput = function () {
      state.running.note = live.value;
      live.style.height = "auto";
      live.style.height = Math.max(44, live.scrollHeight) + "px";
      save();
    };
    card.appendChild(live);
    setTimeout(function () {
      live.style.height = "auto";
      live.style.height = Math.max(44, live.scrollHeight) + "px";
    }, 0);

    var sb = el("button", "btn btn-stop", "Stop");
    sb.onclick = stop;
    acts.appendChild(sb);
    var warn = el("span", "longrun", "");
    warn.id = "live-warn";
    acts.appendChild(warn);
    card.appendChild(acts);

    box.appendChild(card);
    tick();
  }

  function tick() {
    if (!state.running) return;
    var sec = resumeBase() + runningSeconds();
    var d = $("#live-decimal");
    if (!d) return;
    d.firstChild.textContent = fmtH(billable(sec));
    $("#live-elapsed").textContent = clock(sec);
    var into = sec % 3600;                 // seconds into the current hour
    var filled = Math.floor(into / 360);   // completed tenths
    var frac = (into % 360) / 360;
    var segs = $("#live-tenths").children;
    for (var i = 0; i < 10; i++) {
      var b = segs[i].firstChild;
      b.style.width = i < filled ? "100%" : (i === filled ? (frac * 100).toFixed(1) + "%" : "0");
    }
    var whole = Math.floor(sec / 3600);
    $("#live-hourmark").textContent = whole > 0 ? ("hour " + (whole + 1)) : "";
    $("#live-warn").textContent = sec > 4 * 3600
      ? "Running " + Math.floor(sec / 3600) + "h — still on this?" : "";
  }

  function renderMatters() {
    var box = $("#matters");
    box.innerHTML = "";
    var today = todayKey();
    if (!state.matters.length) {
      box.appendChild(el("div", "empty", "No matters yet."));
      return;
    }
    state.matters.forEach(function (m) {
      var row = el("div", "matter");

      var play = el("button", "play");
      var live = state.running && state.running.matterId === m.id;
      if (live) { play.className = "play on"; play.textContent = "■"; play.title = "Stop"; }
      else { play.textContent = "▶"; play.title = "Start"; }
      play.onclick = function () { live ? stop() : start(m.id); };
      row.appendChild(play);

      var col = el("div");
      var nm = el("div", "matter-name", m.name);
      nm.style.cursor = "pointer";
      nm.title = "Edit matter";
      nm.onclick = function () { openMatter(m); };
      col.appendChild(nm);
      if (m.client || m.rate) {
        var sub = [m.client, m.rate ? "$" + m.rate + "/hr" : ""].filter(Boolean).join(" · ");
        col.appendChild(el("div", "matter-sub", sub));
      }
      row.appendChild(col);

      var secToday = state.entries.reduce(function (a, e) {
        return a + (e.matterId === m.id && e.day === today ? e.seconds : 0);
      }, 0);
      var billed = secToday ? billable(secToday) : 0;
      var t = el("div", "matter-today" + (secToday ? "" : " zero"), fmtH(billed));
      row.appendChild(t);

      box.appendChild(row);
    });
  }

  function renderLedger() {
    $("#day-label").textContent = viewDate === todayKey()
      ? "Today"
      : keyToDate(viewDate).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });

    var box = $("#ledger");
    box.innerHTML = "";
    var list = entriesOn(viewDate);
    if (!list.length) {
      box.appendChild(el("div", "empty", "Nothing recorded."));
      return;
    }
    var total = 0, money = 0;
    list.forEach(function (e) {
      var m = matterById(e.matterId) || { name: "(deleted matter)" };
      var b = billable(e.seconds);
      total += b;
      if (m.rate) money += b * m.rate;

      var row = el("div", "entry");
      var tcell = el("div", "entry-time",
        e.start && e.end ? hhmm(e.start) + "–" + hhmm(e.end) : "added");
      if (e.sessions > 1) {
        var s = el("div", null, e.sessions + " sittings");
        s.style.opacity = ".7";
        tcell.appendChild(s);
      }
      row.appendChild(tcell);

      var mid = el("div");
      mid.appendChild(el("div", "entry-matter", m.name));
      var note = document.createElement("textarea");
      note.className = "entry-note";
      note.rows = 1;
      note.placeholder = "What you did";
      note.value = e.note || "";
      note.oninput = function () {
        e.note = note.value; save();
        note.style.height = "auto"; note.style.height = note.scrollHeight + "px";
      };
      mid.appendChild(note);
      setTimeout(function () { note.style.height = "auto"; note.style.height = note.scrollHeight + "px"; }, 0);
      row.appendChild(mid);

      var hrs = document.createElement("input");
      hrs.className = "entry-hours";
      hrs.value = fmtH(b);
      hrs.title = clock(e.seconds) + " elapsed";
      hrs.onchange = function () {
        var s = parseDur(hrs.value);
        if (s > 0) { e.seconds = s; e.edited = true; save(); }
        render();
      };
      row.appendChild(hrs);

      var res = el("button", "entry-resume", "▶");
      if (e.day === todayKey()) {
        res.title = "Resume this entry — new time is added to it";
        res.onclick = function () { resume(e.id); };
      } else {
        res.disabled = true;
        res.style.opacity = ".25";
        res.style.cursor = "default";
        res.title = "Only today's entries can be resumed";
      }
      row.appendChild(res);

      var del = el("button", "entry-del", "×");
      del.title = "Delete entry";
      del.onclick = function () {
        var what = fmtH(b) + " on " + m.name + (e.note ? "\n\n" + e.note : "");
        if (!confirm("Delete this entry?\n\n" + what)) return;
        state.entries = state.entries.filter(function (x) { return x.id !== e.id; });
        save(); render();
      };
      row.appendChild(del);

      box.appendChild(row);
    });

    var tot = el("div", "daytotal");
    tot.appendChild(el("span", "n", total.toFixed(state.settings.round === "exact" ? 2 : 1)));
    tot.appendChild(el("span", "lbl", "billable hours"));
    if (state.settings.money && money > 0) {
      tot.appendChild(el("span", "amt", "$" + money.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })));
    }
    box.appendChild(tot);
  }

  /* ---------------- dialogs --------------------------------------------- */
  function openMatter(m) {
    $("#matter-dlg-title").textContent = m ? "Edit matter" : "Add matter";
    $("#m-id").value = m ? m.id : "";
    $("#m-name").value = m ? m.name : "";
    $("#m-client").value = m && m.client ? m.client : "";
    $("#m-rate").value = m && m.rate ? m.rate : "";
    $("#m-archive").style.display = m ? "" : "none";
    $("#matter-dlg").showModal();
    setTimeout(function () { $("#m-name").focus(); }, 30);
  }
  $("#add-matter-btn").onclick = function () { openMatter(null); };
  $("#m-save").onclick = function () {
    var name = $("#m-name").value.trim();
    if (!name) { $("#m-name").focus(); return; }
    var id = $("#m-id").value;
    var rate = parseFloat($("#m-rate").value) || 0;
    var client = $("#m-client").value.trim();
    if (id) {
      var m = matterById(id);
      m.name = name; m.client = client; m.rate = rate;
    } else {
      state.matters.push({ id: uid(), name: name, client: client, rate: rate });
    }
    save(); $("#matter-dlg").close(); render();
  };
  $("#m-archive").onclick = function () {
    var id = $("#m-id").value;
    var used = state.entries.some(function (e) { return e.matterId === id; });
    var msg = used ? "Remove this matter? Its time entries stay in the ledger." : "Remove this matter?";
    if (!confirm(msg)) return;
    if (state.running && state.running.matterId === id) state.running = null;
    state.matters = state.matters.filter(function (m) { return m.id !== id; });
    save(); $("#matter-dlg").close(); render();
  };

  $("#manual-btn").onclick = function () {
    if (!state.matters.length) { toast("Add a matter first."); return; }
    var sel = $("#x-matter");
    sel.innerHTML = "";
    state.matters.forEach(function (m) {
      var o = document.createElement("option");
      o.value = m.id; o.textContent = m.name; sel.appendChild(o);
    });
    $("#x-date").value = viewDate;
    $("#x-dur").value = "";
    $("#x-note").value = "";
    $("#manual-dlg").showModal();
    setTimeout(function () { $("#x-dur").focus(); }, 30);
  };
  $("#x-save").onclick = function () {
    var sec = parseDur($("#x-dur").value);
    if (!sec) { toast("Enter a duration like 1.4 or 1:24."); return; }
    state.entries.push({
      id: uid(), matterId: $("#x-matter").value, day: $("#x-date").value || todayKey(),
      start: null, end: null, seconds: sec, note: $("#x-note").value.trim()
    });
    viewDate = $("#x-date").value || todayKey();
    save(); $("#manual-dlg").close(); render();
  };

  $("#settings-btn").onclick = function () {
    $("#s-round").value = state.settings.round;
    $("#s-min").value = state.settings.min;
    $("#s-money").checked = !!state.settings.money;
    $("#backup-status").textContent = backupStatusText();
    $("#settings-dlg").showModal();
  };
  $("#s-round").onchange = function () { state.settings.round = this.value; save(); render(); };
  $("#s-min").onchange = function () { state.settings.min = parseFloat(this.value) || 0; save(); render(); };
  $("#s-money").onchange = function () { state.settings.money = this.checked; save(); render(); };
  $("#s-wipe").onclick = function () {
    if (!confirm("Erase every matter and time entry? This cannot be undone.")) return;
    state.matters = []; state.entries = []; state.running = null;
    save(); $("#settings-dlg").close(); render();
  };

  /* ---------------- backup & restore ------------------------------------ */
  function daysSince(key) {
    if (!key) return Infinity;
    return Math.floor((keyToDate(todayKey()) - keyToDate(key)) / 86400000);
  }
  function backupStatusText() {
    var d = state.settings.lastBackup;
    if (!d) return "No backup saved yet.";
    var n = daysSince(d);
    return "Last saved " + (n === 0 ? "today" : n === 1 ? "yesterday" : n + " days ago")
      + " · " + state.entries.length + " entries at the time.";
  }
  function saveBackup() {
    var payload = {
      app: "billable-meter", format: 1, savedAt: new Date().toISOString(),
      matters: state.matters, entries: state.entries, settings: state.settings
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "billable-meter-backup-" + todayKey() + ".json";
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    state.settings.lastBackup = todayKey();
    save(); render();
    $("#backup-status").textContent = backupStatusText();
    toast("Backup saved to your downloads folder.");
  }
  function restoreBackup(file) {
    var fr = new FileReader();
    fr.onload = function () {
      var data;
      try { data = JSON.parse(fr.result); }
      catch (e) { toast("That file isn't a Billable Meter backup."); return; }
      if (!data || !Array.isArray(data.matters) || !Array.isArray(data.entries)) {
        toast("That file isn't a Billable Meter backup."); return;
      }
      var msg = "Restore " + data.entries.length + " entries across " + data.matters.length +
        " matters, saved " + (data.savedAt ? new Date(data.savedAt).toLocaleDateString() : "unknown date") +
        "?\n\nThis replaces everything currently in the app (" + state.entries.length + " entries).";
      if (!confirm(msg)) return;
      state.matters = data.matters;
      state.entries = data.entries;
      state.running = null;
      if (data.settings) state.settings = Object.assign(state.settings, data.settings);
      save(); render();
      $("#backup-status").textContent = backupStatusText();
      toast("Restored " + data.entries.length + " entries.");
    };
    fr.onerror = function () { toast("Couldn't read that file."); };
    fr.readAsText(file);
  }
  $("#s-backup").onclick = saveBackup;
  $("#s-restore").onclick = function () { $("#restore-input").click(); };
  $("#restore-input").onchange = function () {
    if (this.files && this.files[0]) restoreBackup(this.files[0]);
    this.value = "";
  };

  var nudgeDismissed = false;
  function renderNudge() {
    var box = $("#nudge");
    box.innerHTML = "";
    if (nudgeDismissed || !state.entries.length) return;
    var n = daysSince(state.settings.lastBackup);
    if (n < 7) return;
    var bar = el("div", "nudge");
    bar.appendChild(el("span", null, state.settings.lastBackup
      ? "Last backup was " + n + " days ago. " + state.entries.length + " entries are only in this browser."
      : state.entries.length + " time entries live only in this browser. Save a backup file."));
    var b = el("button", "btn", "Save backup");
    b.style.padding = "6px 12px";
    b.onclick = saveBackup;
    bar.appendChild(b);
    var x = el("button", "btn-ghost", "×");
    x.title = "Hide until next launch";
    x.onclick = function () { nudgeDismissed = true; renderNudge(); };
    bar.appendChild(x);
    box.appendChild(bar);
  }

  $("#theme-btn").onclick = function () {
    state.settings.theme = state.settings.theme === "light" ? "dark" : "light";
    save(); render();
  };

  $("#day-prev").onclick = function () { viewDate = shiftDay(viewDate, -1); renderLedger(); };
  $("#day-next").onclick = function () { viewDate = shiftDay(viewDate, 1); renderLedger(); };

  /* ---------------- export ---------------------------------------------- */
  var picked = {};   // day key -> true

  function csvCell(v) {
    v = v == null ? "" : String(v);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  function tsvCell(v) {
    // Excel splits on tabs and newlines; flatten them so one entry stays one cell
    return (v == null ? "" : String(v)).replace(/[\t\r\n]+/g, " ").trim();
  }
  function daysWithEntries() {
    var seen = {};
    state.entries.forEach(function (e) { seen[e.day] = true; });
    return Object.keys(seen).sort().reverse();   // newest first for the picker
  }
  function pickedDays() {
    return Object.keys(picked).filter(function (d) { return picked[d]; }).sort();
  }
  function pickedEntries() {
    var days = picked;
    return state.entries.filter(function (e) { return days[e.day]; })
      .sort(function (a, b) {
        return a.day.localeCompare(b.day) || (a.start || "").localeCompare(b.start || "");
      });
  }
  function dayTotal(day) {
    return state.entries.reduce(function (a, e) {
      return a + (e.day === day ? billable(e.seconds) : 0);
    }, 0);
  }
  function dayCount(day) {
    return state.entries.filter(function (e) { return e.day === day; }).length;
  }

  function buildRows(wide) {
    var head = wide
      ? ["Date", "Client", "Matter", "Description", "Hours", "Start", "End", "Elapsed", "Rate", "Amount"]
      : ["Date", "Client", "Matter", "Description", "Hours"];
    var rows = [head];
    pickedEntries().forEach(function (e) {
      var m = matterById(e.matterId) || { name: "(deleted matter)", client: "", rate: 0 };
      var b = billable(e.seconds);
      var date = keyToDate(e.day).toLocaleDateString("en-US");
      rows.push(wide
        ? [date, m.client || "", m.name, e.note || "", fmtH(b),
           e.start ? hhmm(e.start) : "", e.end ? hhmm(e.end) : "", clock(e.seconds),
           m.rate || "", m.rate ? (b * m.rate).toFixed(2) : ""]
        : [date, m.client || "", m.name, e.note || "", fmtH(b)]);
    });
    return rows;
  }
  function buildCSV() {
    return buildRows(true).map(function (r) { return r.map(csvCell).join(","); }).join("\n");
  }
  function buildTSV(withHeader) {
    var rows = buildRows(false);
    if (!withHeader) rows = rows.slice(1);
    return rows.map(function (r) { return r.map(tsvCell).join("\t"); }).join("\n");
  }

  function renderDayPick() {
    var box = $("#e-days");
    box.innerHTML = "";
    var days = daysWithEntries();
    if (!days.length) {
      box.appendChild(el("div", "empty", "No entries yet."));
      return;
    }
    days.forEach(function (d) {
      var lab = document.createElement("label");
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!picked[d];
      cb.onchange = function () { picked[d] = cb.checked; refreshPreview(); };
      lab.appendChild(cb);
      var nm = el("span", null, keyToDate(d).toLocaleDateString(undefined,
        { weekday: "short", month: "short", day: "numeric", year: "numeric" }));
      lab.appendChild(nm);
      var n = dayCount(d);
      lab.appendChild(el("span", "d-n", n + (n === 1 ? " entry" : " entries")));
      lab.appendChild(el("span", "d-hrs", dayTotal(d).toFixed(1)));
      box.appendChild(lab);
    });
  }
  function refreshPreview() {
    var n = pickedEntries().length;
    var d = pickedDays().length;
    var hrs = pickedEntries().reduce(function (a, e) { return a + billable(e.seconds); }, 0);
    $("#e-out").value = n
      ? buildCSV() + "\n\n— " + n + " entries across " + d + (d === 1 ? " day" : " days")
        + ", " + hrs.toFixed(1) + " hours —"
      : "Select one or more days above.";
  }
  function applyPick(kind) {
    var days = daysWithEntries();
    var today = todayKey();
    var start;
    if (kind === "week") {
      var dt = keyToDate(today);
      dt.setDate(dt.getDate() - dt.getDay());   // back to Sunday
      start = todayKey(dt);
    } else if (kind === "month") {
      start = today.slice(0, 8) + "01";
    }
    picked = {};
    days.forEach(function (d) {
      if (kind === "all") picked[d] = true;
      else if (kind === "today") picked[d] = (d === today);
      else if (kind === "none") picked[d] = false;
      else picked[d] = (d >= start && d <= today);
    });
    renderDayPick();
    refreshPreview();
  }
  document.querySelectorAll("[data-pick]").forEach(function (b) {
    b.onclick = function () { applyPick(b.getAttribute("data-pick")); };
  });

  $("#export-btn").onclick = function () {
    if (!state.entries.length) { toast("Nothing to export yet."); return; }
    applyPick("today");
    $("#export-dlg").showModal();
  };
  function copyText(txt, msg) {
    var ta = document.createElement("textarea");
    ta.value = txt;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () {}, function () {});
      ok = true;
    }
    ta.remove();
    toast(ok ? msg : "Copy failed — select the preview and press Ctrl+C.");
  }
  $("#e-copy").onclick = function () {
    if (!pickedEntries().length) { toast("Select at least one day."); return; }
    copyText(buildCSV(), "CSV copied.");
  };
  $("#e-tsv").onclick = function () {
    var n = pickedEntries().length;
    if (!n) { toast("Select at least one day."); return; }
    copyText(buildTSV(false), n + " rows copied — paste with Ctrl+Shift+V in Excel.");
  };
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/\r?\n/g, "<br>");
  }
  // An HTML table on the clipboard: Excel reads the CSS and applies the font
  // and wrap setting to the cells it creates.
  function buildHTML() {
    var rows = buildRows(false).slice(1);   // no header row
    var base = "font-family:'Bookman Old Style',Bookman,serif;font-size:11.0pt;"
             + "vertical-align:top;white-space:normal;word-wrap:break-word;"
             + "mso-data-placement:same-cell;padding:0;border:none;";
    var body = rows.map(function (r) {
      return "<tr>" + r.map(function (c, i) {
        // date and hours read better without wrap; description needs it
        var extra = (i === 0 || i === 4) ? "white-space:nowrap;" : "";
        return '<td style="' + base + extra + '">' + esc(c) + "</td>";
      }).join("") + "</tr>";
    }).join("");
    return '<meta charset="utf-8"><table><tbody>' + body + "</tbody></table>";
  }
  function copyRich(html, plain, msg) {
    function handler(ev) {
      ev.clipboardData.setData("text/html", html);
      ev.clipboardData.setData("text/plain", plain);
      ev.preventDefault();
    }
    document.addEventListener("copy", handler);
    var ta = document.createElement("textarea");
    ta.value = plain;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove();
    document.removeEventListener("copy", handler);
    if (!ok && window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      navigator.clipboard.write([new ClipboardItem({
        "text/html": new Blob([html], { type: "text/html" }),
        "text/plain": new Blob([plain], { type: "text/plain" })
      })]).then(function () {}, function () {});
      ok = true;
    }
    toast(ok ? msg : "Copy failed — use Copy CSV instead.");
  }
  $("#e-rich").onclick = function () {
    var n = pickedEntries().length;
    if (!n) { toast("Select at least one day."); return; }
    copyRich(buildHTML(), buildTSV(false), n + " rows copied — paste with plain Ctrl+V.");
  };
  $("#e-download").onclick = function () {
    var days = pickedDays();
    if (!days.length) { toast("Select at least one day."); return; }
    var blob = new Blob([buildCSV()], { type: "text/csv" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "time-" + days[0] + (days.length > 1 ? "-to-" + days[days.length - 1] : "") + ".csv";
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };

  /* ---------------- misc ------------------------------------------------- */
  var toastTimer;
  function toast(msg) {
    var t = $("#toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }
  document.querySelectorAll("[data-close]").forEach(function (b) {
    b.onclick = function () { b.closest("dialog").close(); };
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === " " && e.target === document.body) {
      e.preventDefault();
      if (state.running) stop();
      else if (state.matters.length) start(state.matters[0].id);
    }
  });
  window.addEventListener("beforeunload", function () {
    clearTimeout(saveTimer); store.set(state);
  });
  setInterval(tick, 500);
  // keep the day label honest if the app is left open past midnight
  setInterval(function () {
    if ($("#day-label").textContent === "Today" && viewDate !== todayKey()) { viewDate = todayKey(); render(); }
  }, 60000);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }

  (async function boot() {
    var saved = await store.get();
    if (saved) {
      state.matters = saved.matters || [];
      state.entries = saved.entries || [];
      state.running = saved.running || null;
      state.settings = Object.assign(state.settings, saved.settings || {});
    }
    render();
  })();
})();
</script>
